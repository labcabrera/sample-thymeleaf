<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<section th:fragment="content">
    <div class="section">
        <div class="row">
            <div class="col s12">
                <h4>Error</h4>
                <div class="card red lighten-5">
                    <div class="card-content">
                        <span class="card-title text-accent">Status: <span th:text="${status}"></span></span>
                        <p th:text="${message}"></p>
                        <p><strong>Path:</strong> <span th:text="${path}"></span></p>
                    </div>
                    <div class="card-action">
                        <a th:href="@{/}">Home</a>
                        <!-- <a th:href="javascript:history.back()">Back</a> -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

</html>
