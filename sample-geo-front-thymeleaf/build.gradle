plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.openapi.generator' version '7.21.0'
	id 'jacoco'
}

group = 'org.labcabrera.sample.front'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'com.nimbusds:nimbus-jose-jwt:9.31'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.register('openApiGenerateGeoApi', org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
	generatorName = 'java'
	library = "restclient"
	inputSpec = "$rootDir/src/main/resources/api-clients/geo-api.yaml"
	outputDir = "$buildDir/generated/sources/openapi/geo-client"
	apiPackage = 'org.labcabrera.sample.front.generated.client.geo.api'
	modelPackage = 'org.labcabrera.sample.front.generated.client.geo.model'
	invokerPackage = 'org.labcabrera.sample.front.generated.client.geo'
	configOptions = [
		useSpringBoot3          : 'false',
		useSpringBoot4          : 'true',
		interfaceOnly           : 'true',
		useJackson3             : "true",
		useJakartaEe            : "true",
		useJspecify		        : "true",
		useFeignClientUrls      : 'true',
		useFeignClientContextId : 'true',
		useTags                 : 'true',
		dateLibrary             : 'java8-localdatetime',
		openApiNullable         : 'false',
	]
	additionalProperties = [
		serializableModel: 'true'
	]
}

sourceSets.main.java.srcDir file("$buildDir/generated/sources/openapi/geo-client/src/main/java")

tasks.named('compileJava') {
	dependsOn tasks.named('openApiGenerateGeoApi')
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

jar {
	enabled = false
	archiveClassifier = ''
}

