<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<section th:fragment="content">
    <div class="section">
        <div class="row">
            <div class="col s12">
                <nav style="margin-bottom:12px; width:100%;">
                    <div class="nav-wrapper">
                        <div class="col s12" style="display:flex; align-items:center; justify-content:space-between;">
                            <div>
                                <a th:href="@{/geo}" class="breadcrumb">Geo</a>
                                <span class="breadcrumb" style="opacity:0.6;">Municipalities</span>
                            </div>
                        </div>
                    </div>
                </nav>
                <a class="waves-effect waves-light btn btn-primary" th:href="@{/municipalities/create}">Create Municipality</a>
                <table class="striped">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Province</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="m : ${municipalities}">
                            <td>
                                <a th:href="@{/municipalities/{id}(id=${m.id})}" th:text="${m.name}"></a>
                            </td>
                            <td>
                                <a th:href="@{/provinces/{id}(id=${m.provinceId})}" th:text="${m.provinceId}"></a>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div th:if="${totalPages} &gt; 1" class="section">
                    <ul class="pagination">
                        <li th:classappend="${page == 0} ? 'disabled' : 'waves-effect'">
                            <a th:href="@{/municipalities(q=${q}, page=${page - 1}, size=${size})}"><i
                                    class="material-icons">chevron_left</i></a>
                        </li>
                        <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == page} ? 'active' : 'waves-effect'">
                            <a th:href="@{/municipalities(q=${q}, page=${i}, size=${size})}" th:text="${i + 1}">1</a>
                        </li>
                        <li th:classappend="${page + 1 == totalPages} ? 'disabled' : 'waves-effect'">
                            <a th:href="@{/municipalities(q=${q}, page=${page + 1}, size=${size})}"><i
                                    class="material-icons">chevron_right</i></a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</section>

</html>
