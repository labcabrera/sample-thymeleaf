plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
	//TODO pendiente de version compatible con Spring Boot 4 que aun esta en desarrollo
	id 'org.openapi.generator' version '7.21.0'
	id 'org.sonarqube' version '6.0.1.5171'
	id 'jacoco'
}

group = 'org.labcabrera.sample.api'
description = 'Ejemplo de API REST'

ext {
	logstashLogbackVersion = '7.4'
	springdocVersion = '3.0.1'
	swaggerAnnotationsVersion = '2.2.13'
	springCloudVersion = '2025.1.0'
	rsqlParserVersion = '2.1.0'
	mapstructVersion = '1.5.5.Final'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	//implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	//implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	implementation 'org.springframework.cloud:spring-cloud-stream'
	implementation 'org.springframework.cloud:spring-cloud-stream-binder-kafka'

	implementation 'io.github.resilience4j:resilience4j-spring-boot3'
	implementation "net.logstash.logback:logstash-logback-encoder:${logstashLogbackVersion}"
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"
	implementation "org.mapstruct:mapstruct:${mapstructVersion}"
	implementation "cz.jirutka.rsql:rsql-parser:${rsqlParserVersion}"

	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	compileOnly 'org.projectlombok:lombok'
  	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
}

openApiGenerate {
    generatorName = "spring"
    inputSpec = "$rootDir/src/main/resources/api-definition.yaml"
    outputDir = "$buildDir/generated/sources/openapi/server"
    apiPackage = "com.labcabrera.sample.archetype.generated.api"
    modelPackage = "com.labcabrera.sample.archetype.generated.model"
    configOptions = [
		library 			: "spring-cloud",
        interfaceOnly       : "true",
        useTags             : "true",
        useSpringBoot3      : "false",
		useSpringBoot4      : "true",
		useJackson3         : "true",
		useJakartaEe        : "true",
		useJspecify		    : "true",
        singleContentTypes  : "false",
        unhandledException  : "true",
		openApiNullable     : "false",
		dateLibrary         : "java8-localdatetime"
    ]
	additionalProperties = [
		useJacksonNullable: "false"
	]
}

sourceSets.main.java.srcDir file("$buildDir/generated/sources/openapi/server/src/main/java")

tasks.named('compileJava') {
	dependsOn tasks.named('openApiGenerate')
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.withType(JavaCompile).configureEach {
	options.annotationProcessorGeneratedSourcesDirectory = file("$buildDir/generated/sources/annotations")
	options.compilerArgs += ["-Amapstruct.defaultComponentModel=spring"]
}

jar {
	enabled = false
	archiveClassifier = ''
}

sonarqube {
	properties {
		property "sonar.projectKey", "archetype-spring-cloud-stream-vertical-slice-contract-first"
		property "sonar.projectName", "Archetype Spring Cloud Stream Vertical Slice Contract First"
		property "sonar.host.url", "http://localhost:9000"
		property "sonar.token", System.getenv("SONAR_TOKEN")
		property "sonar.coverage.jacoco.xmlReportPaths", "${buildDir}/reports/jacoco/test/jacocoTestReport.xml"
	}
}
