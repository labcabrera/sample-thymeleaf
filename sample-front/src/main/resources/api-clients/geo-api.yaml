    post:
      tags:
        - Countries
      summary: Create country
      description: Creates a new country with the provided data
      operationId: createCountry
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCountryDto'
        required: true
      responses:
        '201':
          description: Country
          content:
