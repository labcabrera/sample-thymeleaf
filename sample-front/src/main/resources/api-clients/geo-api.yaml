      security:
        - oidc: []
  /api/v1/provinces/{provinceId}:
    get:
      tags:
        - Provinces
      summary: Get province by id
      description: Get province by id
      operationId: getProvinceById
      parameters:
        - name: provinceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Province
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvinceDto'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
        - oidc: []
        - bearerAuth: []
    delete:
      tags:
        - Provinces
      summary: Delete province
      description: Deletes a province by id
      operationId: deleteProvince
      parameters:
        - name: provinceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No content
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
        - oidc: []
    patch:
      tags:
        - Provinces
      summary: Update province
      description: Updates an existing province
      operationId: updateProvince
      parameters:
        - name: provinceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProvinceDto'
        required: true
      responses:
        '200':
          description: Province
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvinceDto'
        '400':
          description: Invalid province data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
