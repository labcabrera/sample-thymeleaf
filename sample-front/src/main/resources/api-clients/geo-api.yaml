openapi: 3.1.0
info:
  title: Sample Geo API
  description: REST API for Gepraphic data management
  contact:
    name: Luis Cabrera
    email: lab.cabrera@gmail.com
  version: 1.0.0
servers:
  - url: http://localhost:8082
security:
  - oidc: []
tags:
  - name: Provinces
    description: Endpoints for managing provinces
  - name: Countries
    description: Endpoints for managing countries
  - name: Municipalities
    description: Endpoints for managing municipalities
paths:
  /api/v1/provinces:
    get:
      tags:
        - Provinces
      summary: Get provinces by RSQL
      description: Filter provinces using an RSQL expression with optional pagination
      operationId: getProvincesByRsql
      parameters:
        - name: q
          in: query
          description: RSQL expression to filter provinces
          required: false
          schema:
            type: string
            default: ''
        - name: page
          in: query
          description: Zero-based page index (0..N)
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          description: The size of the page to be returned
          required: false
          schema:
            type: integer
            format: int32
            default: 20
        - name: sort
          in: query
          description: >-
            Sorting criteria in the format: property,(asc|desc). Multiple sort
            criteria supported.
          required: false
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Paged provinces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvincePage'
        '400':
          description: Invalid RSQL expression
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
        - oidc: []
    post:
      tags:
        - Provinces
      summary: Create province
      description: Creates a new province with the provided data
      operationId: createProvince
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProvinceDto'
        required: true
      responses:
        '201':
          description: Province
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvinceDto'
        '400':
          description: Invalid province data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Province already exists (code or name)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
        - oidc: []
