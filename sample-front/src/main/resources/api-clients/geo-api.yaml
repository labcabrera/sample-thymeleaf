          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
        - oidc: []
    patch:
      tags:
        - Municipalities
      summary: Update municipality
      description: Updates an existing municipality
      operationId: updateMunicipality
      parameters:
        - name: municipalityId
          in: path
          required: true
