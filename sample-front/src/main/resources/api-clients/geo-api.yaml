      responses:
        '200':
          description: Paged municipalities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MunicipalityPage'
        '400':
          description: Invalid RSQL expression
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
        - oidc: []
    post:
      tags:
        - Municipalities
      summary: Create municipality
      description: Creates a new municipality with the provided data
