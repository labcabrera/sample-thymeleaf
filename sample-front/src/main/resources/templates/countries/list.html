<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<section th:fragment="content">
    <div class="section">
        <div class="row">
            <div class="col s12">
                <h4>Countries</h4>
                <a class="waves-effect waves-light btn btn-primary" th:href="@{/countries/create}">Create Country</a>
                <form id="searchForm" th:action="@{/countries}" method="get"
                    onsubmit="document.getElementById('q').value='name=re='+encodeURIComponent(document.getElementById('nameSearch').value);">
                    <div class="input-field" style="display:flex; align-items:center; gap:8px; margin-top:12px; margin-bottom:12px;">
                        <i class="material-icons prefix" style="margin-right:4px">search</i>
                        <input id="nameSearch" type="text" name="name" placeholder="Search by name" th:value="${param.name}" />
                        <input type="hidden" id="q" name="q" th:value="${q}" />
                        <input type="hidden" name="size" th:value="${size}" />
                        <button class="btn-small btn-primary" type="submit" style="height:36px;">
                            <i class="material-icons">search</i>
                        </button>
                        <button class="btn-small btn-primary" type="button" style="height:36px; margin-left:4px;"
                            onclick="var f=document.getElementById('searchForm'); f.onsubmit=null; document.getElementById('nameSearch').value=''; document.getElementById('q').value=''; f.submit();">
                            Reset
                        </button>
                    </div>
                </form>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${countries}">
                            <td th:text="${c.id}"></td>
                            <td><a th:href="@{/countries/{id}(id=${c.id})}" th:text="${c.name}"></a></td>
                        </tr>
                    </tbody>
                </table>
                <div th:if="${totalPages} &gt; 1" class="section">
                    <ul class="pagination">
                        <li th:classappend="${page == 0} ? 'disabled' : 'waves-effect'">
                            <a th:href="@{/countries(q=${q}, page=${page - 1}, size=${size})}">
                                <i class="material-icons">chevron_left</i>
                            </a>
                        </li>
                        <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == page} ? 'active' : 'waves-effect'">
                            <a th:href="@{/countries(q=${q}, page=${i}, size=${size})}" th:text="${i + 1}">1</a>
                        </li>
                        <li th:classappend="${page + 1 == totalPages} ? 'disabled' : 'waves-effect'">
                            <a th:href="@{/countries(q=${q}, page=${page + 1}, size=${size})}">
                                <i class="material-icons">chevron_right</i>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</section>

</html>
