<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<section th:fragment="content">
    <div class="section">
        <div class="row">
            <div class="col s12">
                <nav style="margin-bottom:12px; width:100%;">
                    <div class="nav-wrapper">
                        <div class="col s12">
                            <a th:href="@{/geo}" class="breadcrumb">Geo</a>
                            <a th:href="@{/countries}" class="breadcrumb">Countries</a>
                            <span class="breadcrumb" style="opacity:0.6;" th:text="${country.name}">Country</span>
                        </div>
                    </div>
                </nav>
                <div style="display:flex; align-items:center; justify-content:space-between;">
                    <h4 th:text="${country.name}">Country</h4>
                    <div>
                        <a class="waves-effect waves-light btn btn-primary" th:href="@{/countries/{id}/edit(id=${country.id})}">Edit</a>
                        <form th:action="@{/countries/{id}/delete(id=${country.id})}" method="post" style="display:inline">
                            <button type="submit" class="waves-effect waves-light btn btn-secondary"
                                onclick="return confirm('Are you sure you want to delete this province?');">Delete</button>
                        </form>
                    </div>
                </div>

                <table class="striped">
                    <tbody>
                        <tr>
                            <th>ID</th>
                            <td th:text="${country.id}"></td>
                        </tr>
                        <tr>
                            <th>Name</th>
                            <td th:text="${country.name}"></td>
                        </tr>
                        <tr>
                            <th>Created</th>
                            <td th:text="${country.createdAt}"></td>
                        </tr>
                        <tr>
                            <th>Updated</th>
                            <td th:text="${country.updatedAt}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>

</html>
