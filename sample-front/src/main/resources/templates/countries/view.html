<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<section th:fragment="content">
    <div class="section">
        <div class="row">
            <div class="col s12">
                <div style="display:flex; align-items:center; justify-content:space-between;">
                    <h4 th:text="${country.name}">Country</h4>
                    <div>
                        <a class="waves-effect waves-light btn btn-primary" th:href="@{/countries/{id}/edit(id=${country.id})}">Edit</a>
                        <form th:action="@{/countries/{id}/delete(id=${country.id})}" method="post" style="display:inline">
                            <button class="waves-effect waves-light btn btn-secondary" type="submit">Delete</button>
                        </form>
                    </div>
                </div>

                <table class="striped">
                    <tbody>
                        <tr>
                            <th>ID</th>
                            <td th:text="${country.id}"></td>
                        </tr>
                        <tr>
                            <th>Name</th>
                            <td th:text="${country.name}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>

</html>
