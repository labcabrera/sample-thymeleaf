<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<section th:fragment="content">
    <div class="section">
        <div class="row">
            <div class="col s12">
                <h4>Provinces</h4>
                <a class="waves-effect waves-light btn btn-primary" th:href="@{/provinces/create}">Create Province</a>
                <form id="provinceSearchForm" th:action="@{/provinces}" method="get">
                    <div class="input-field" style="display:flex; align-items:center; gap:8px; margin-top:12px; margin-bottom:12px;">
                        <i class="material-icons prefix" style="margin-right:4px">search</i>
                        <input id="provinceNameSearch" type="text" name="name" placeholder="Province name" th:value="${param.name}" />
                        <input type="hidden" id="q" name="q" th:value="${q}" />
                        <input type="hidden" name="size" th:value="${size}" />
                        <button class="btn-small btn-primary" type="submit" style="height:36px;">
                            <i class="material-icons">search</i>
                        </button>
                        <button id="provinceResetBtn" class="btn-small btn-primary" type="button" style="height:36px; margin-left:4px;">
                            Reset
                        </button>
                    </div>
                </form>
                <script>
                    (function () {
                        var form = document.getElementById('provinceSearchForm');
                        if (!form) return;
                        form.addEventListener('submit', function (e) {
                            if (form.dataset.skipHandler) { delete form.dataset.skipHandler; return; }
                            var nameEl = document.getElementById('provinceNameSearch');
                            var name = nameEl ? nameEl.value.trim() : '';
                            var parts = [];
                            if (name) parts.push('name=re=' + encodeURIComponent(name));
                            var q = document.getElementById('q');
                            if (q) q.value = parts.join(';');
                        });
                        var resetBtn = document.getElementById('provinceResetBtn');
                        if (resetBtn) {
                            resetBtn.addEventListener('click', function () {
                                form.dataset.skipHandler = 'true';
                                var nameEl = document.getElementById('provinceNameSearch'); if (nameEl) nameEl.value = '';
                                var q = document.getElementById('q'); if (q) q.value = '';
                                // ensure page reset if present
                                var pageInput = form.querySelector('input[name=page]'); if (pageInput) pageInput.value = '0';
                                form.submit();
                            });
                        }
                    })();
                </script>
                <table class="striped">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Country</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${provinces}">
                            <td>
                                <a th:href="@{/provinces/{id}(id=${p.id})}" th:text="${p.name}"></a>
                            </td>
                            <td>
                                <a th:if="${p.countryId} != null" th:href="@{/countries/{id}(id=${p.countryId})}"
                                    th:text="${p.countryId}"></a>
                                <span th:if="${p.countryId} == null">-</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div th:if="${totalPages} &gt; 1" class="section">
                    <ul class="pagination">
                        <li th:classappend="${page == 0} ? 'disabled' : 'waves-effect'">
                            <a th:href="@{/provinces(q=${q}, page=${page - 1}, size=${size})}">
                                <i class="material-icons">chevron_left</i>
                            </a>
                        </li>
                        <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == page} ? 'active' : 'waves-effect'">
                            <a th:href="@{/provinces(q=${q}, page=${i}, size=${size})}" th:text="${i + 1}">1</a>
                        </li>
                        <li th:classappend="${page + 1 == totalPages} ? 'disabled' : 'waves-effect'">
                            <a th:href="@{/provinces(q=${q}, page=${page + 1}, size=${size})}">
                                <i class="material-icons">chevron_right</i>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</section>

</html>
