<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<section th:fragment="content">
    <div class="section">
        <div class="row">
            <div class="col s12">
                <h4>Municipalities</h4>
                <a class="waves-effect waves-light btn btn-primary" th:href="@{/municipalities/create}">Create
                    Municipality</a>
                <table class="striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Province</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="m : ${municipalities}">
                            <td th:text="${m.id}"></td>
                            <td th:text="${m.name}"></td>
                            <td th:text="${m.provinceId}"></td>
                            <td>
                                <a class="btn-small btn-primary"
                                    th:href="@{/municipalities/{id}/edit(id=${m.id})}">Edit</a>
                                <form th:action="@{/municipalities/{id}/delete(id=${m.id})}" method="post"
                                    style="display:inline">
                                    <button class="btn-small btn-primary red" type="submit">Delete</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div th:if="${totalPages} &gt; 1" class="section">
                    <ul class="pagination">
                        <li th:classappend="${page == 0} ? 'disabled' : 'waves-effect'">
                            <a th:href="@{/municipalities(q=${q}, page=${page - 1}, size=${size})}"><i
                                    class="material-icons">chevron_left</i></a>
                        </li>
                        <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                            th:classappend="${i == page} ? 'active' : 'waves-effect'">
                            <a th:href="@{/municipalities(q=${q}, page=${i}, size=${size})}" th:text="${i + 1}">1</a>
                        </li>
                        <li th:classappend="${page + 1 == totalPages} ? 'disabled' : 'waves-effect'">
                            <a th:href="@{/municipalities(q=${q}, page=${page + 1}, size=${size})}"><i
                                    class="material-icons">chevron_right</i></a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</section>

</html>
