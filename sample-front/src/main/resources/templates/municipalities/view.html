<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<section th:fragment="content">
    <div class="section">
        <div class="row">
            <div class="col s12">
                <nav style="margin-bottom:12px; width:100%;">
                    <div class="nav-wrapper">
                        <div class="col s12">
                            <a th:href="@{/geo}" class="breadcrumb">Geo</a>
                            <a th:href="@{/municipalities}" class="breadcrumb">Municipalities</a>
                            <span class="breadcrumb" style="opacity:0.6;" th:text="${municipality.name}">Municipality</span>
                        </div>
                    </div>
                </nav>
                <div style="display:flex; align-items:center; justify-content:space-between;">
                    <h4 th:text="${municipality.name}">Municipality</h4>
                    <div>
                        <a class="waves-effect waves-light btn btn-primary"
                            th:href="@{/municipalities/{id}/edit(id=${municipality.id})}">Edit</a>
                        <form th:action="@{/municipalities/{id}/delete(id=${municipality.id})}" method="post" style="display:inline">
                            <button type="submit" class="waves-effect waves-light btn btn-secondary"
                                onclick="return confirm('Are you sure you want to delete this municipality?');">Delete</button>
                        </form>
                    </div>
                </div>

                <table class="striped">
                    <tbody>
                        <tr>
                            <th>ID</th>
                            <td th:text="${municipality.id}"></td>
                        </tr>
                        <tr>
                            <th>Name</th>
                            <td th:text="${municipality.name}"></td>
                        </tr>
                        <tr>
                            <th>Province</th>
                            <td>
                                <a th:if="${municipality.provinceId} != null" th:href="@{/provinces/{id}(id=${municipality.provinceId})}"
                                    th:text="${provinceName != null ? provinceName : municipality.provinceId}"></a>
                                <span th:if="${municipality.provinceId} == null">-</span>
                            </td>
                        </tr>
                        <tr>
                            <th>Created</th>
                            <td th:text="${municipality.createdAt}"></td>
                        </tr>
                        <tr>
                            <th>Updated</th>
                            <td th:text="${municipality.updatedAt}"></td>
                        </tr>
                    </tbody>
                </table>


            </div>
        </div>
    </div>
</section>



</html>
