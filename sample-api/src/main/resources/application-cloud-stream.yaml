spring:
  cloud:
    function:
      definition: onCaseFolderCreation;onCaseFolderCreated;onCaseFolderDeleted;onCaseStepCreated
    stream:
      bindings:
        # input bindings
        onCountryCreation-in-0:
          destination: sample.countries.creation.v1
          group: sample-svc
          contentType: application/json
          consumer:
            max-attempts: 5
            back-off-initial-interval: 500
            back-off-max-interval: 10000
            back-off-multiplier: 2.0
            default-retryable: true
            retryable-exceptions:
              org.labcabrera.sample.archetype.shared.domain.exceptions.BadRequestException: false
        # output bindings
        countryCreated-out-0:
          destination: sample.countries.created.v1
          contentType: application/json
        countryUpdated-out-0:
          destination: sample.countries.updated.v1
          contentType: application/json
        countryDeleted-out-0:
          destination: sample.countries.deleted.v1
          contentType: application/json
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9092}
          autoCreateTopics: true
          minPartitionCount: 1
        bindings:
          onCaseFolderCreated-in-0:
            consumer:
              enable-dlq: true
              dlq-name: sample.case-folders.created.dlq.v1
              dlq-partitions: 1